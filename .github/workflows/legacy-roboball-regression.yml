name: Legacy RoboBall Regression

on:
  push:
  pull_request:

jobs:
  compile-roboball-2024:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout motor library
        uses: actions/checkout@v5

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install AVR core and Servo
        run: |
          set -euo pipefail
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8
          arduino-cli lib install Servo@1.3.0

      - name: Fetch pinned RoboBall 2024 and PS2X regression dependencies
        env:
          ROBOBALL_SHA: 5c6f1bccbc052173e73d187a7d0389c9195f3abf
          PS2X_SHA: b4a7f3c6691301c3bbf5f0c2f82662d23fec8aa2
        run: |
          set -euo pipefail

          git clone --no-checkout https://github.com/Tunglam0605/TungLamvsRoboBall2024.git /tmp/TungLamvsRoboBall2024
          git -C /tmp/TungLamvsRoboBall2024 checkout --detach "$ROBOBALL_SHA"

          git clone --no-checkout https://github.com/madsci1016/Arduino-PS2X.git /tmp/Arduino-PS2X
          git -C /tmp/Arduino-PS2X checkout --detach "$PS2X_SHA"

          echo "RoboBall regression commit: $(git -C /tmp/TungLamvsRoboBall2024 rev-parse HEAD)"
          echo "PS2X regression commit:     $(git -C /tmp/Arduino-PS2X rev-parse HEAD)"

      - name: Compile every RoboBall 2024 vehicle project unchanged
        shell: bash
        run: |
          set -euo pipefail
          for sketch in /tmp/TungLamvsRoboBall2024/*; do
            if [ -d "$sketch" ] && [ -f "$sketch/$(basename "$sketch").ino" ]; then
              echo "=== Regression compiling $(basename "$sketch") ==="
              arduino-cli compile \
                --fqbn arduino:avr:mega \
                --library . \
                --library /tmp/Arduino-PS2X/PS2X_lib \
                "$sketch"
            fi
          done
