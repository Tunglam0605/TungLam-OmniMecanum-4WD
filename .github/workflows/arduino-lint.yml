name: Arduino Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Vietnamese/English localization parity
        run: python3 tools/check_localization.py

      - name: Verify Vietnamese public API hints
        run: python3 tools/check_api_docs.py

      - name: Arduino Lint
        uses: arduino/arduino-lint-action@v3
        with:
          library-manager: update
          compliance: strict
          project-type: library
