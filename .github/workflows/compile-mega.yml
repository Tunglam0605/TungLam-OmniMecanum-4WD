name: Arduino Mega Compile

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned Arduino CLI
        uses: ./.github/actions/setup-arduino-cli

      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr@1.8.8

      - name: Compile every example for Arduino Mega
        shell: bash
        run: |
          set -euo pipefail
          for sketch in examples/*; do
            if [ -d "$sketch" ]; then
              echo "=== Compiling $sketch ==="
              arduino-cli compile --fqbn arduino:avr:mega --library . "$sketch"
            fi
          done
