name: Setup pinned Arduino CLI
description: Install a checksum-verified Arduino CLI without a Node-based setup action.

inputs:
  version:
    description: Arduino CLI version.
    required: false
    default: "1.5.1"
  sha256:
    description: SHA-256 for the Linux x86_64 release archive.
    required: false
    default: "28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b"

runs:
  using: composite
  steps:
    - name: Download and verify Arduino CLI
      shell: bash
      env:
        ARDUINO_CLI_VERSION: ${{ inputs.version }}
        ARDUINO_CLI_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail

        archive="arduino-cli_${ARDUINO_CLI_VERSION}_Linux_64bit.tar.gz"
        url="https://github.com/arduino/arduino-cli/releases/download/v${ARDUINO_CLI_VERSION}/${archive}"

        curl --fail --silent --show-error --location --retry 3           --output "/tmp/${archive}"           "${url}"

        echo "${ARDUINO_CLI_SHA256}  /tmp/${archive}" | sha256sum --check --strict

        mkdir -p "${HOME}/.local/bin"
        tar -xzf "/tmp/${archive}" -C /tmp
        install -m 0755 /tmp/arduino-cli "${HOME}/.local/bin/arduino-cli"

        echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
        "${HOME}/.local/bin/arduino-cli" version
